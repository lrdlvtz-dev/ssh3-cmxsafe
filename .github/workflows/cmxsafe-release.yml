name: CMXsafe signed release

on:
  push:
    tags:
      - 'cmxsafe-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version used for a non-publishing validation build
        required: true
        default: 0.0.0-test

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Require release tags to point into main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify source before packaging
        shell: bash
        run: |
          gofmt -w $(git ls-files '*.go')
          git diff --exit-code
          go test ./...
          go test -race ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Build reproducible Linux bundles
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          VALIDATION_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${RELEASE_VERSION#cmxsafe-v}"
          else
            version="$VALIDATION_VERSION"
          fi
          ./scripts/build_cmxsafe_release.sh "$version" "$GITHUB_SHA" dist

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          path: ./dist
          format: spdx-json
          output-file: ./dist/ssh3-cmxsafe.spdx.json
          upload-artifact: false

      - name: Finalize checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./*.tar.gz cmxsafe-component.json ssh3-cmxsafe.spdx.json > SHA256SUMS

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with GitHub OIDC
        if: github.event_name == 'push'
        shell: bash
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Attest release archives
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ssh3-cmxsafe-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable-input prerelease
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; refusing to replace its assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "CMXsafe SSH3 ${GITHUB_REF_NAME#cmxsafe-v}" \
            --notes "Experimental CMXsafe SSH3 release. Verify SHA256SUMS.sigstore.json, GitHub provenance, SBOM, and the component manifest before use."
